name: Build Reference Library

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fill-missing | refresh-all'
        required: true
        default: 'fill-missing'
  push:
    branches: [ main ]
    paths:
      - 'references-manifest.json'
      - 'scripts/build_references.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Prevent multiple concurrent runs racing each other
    concurrency:
      group: build-references
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow beautifulsoup4 ddgs

      - name: Clean up old single-file v4 references
        run: |
          find base-photos -maxdepth 3 -name "*.jpg" -type f -delete 2>/dev/null || true
          find parallels -maxdepth 3 -name "*.jpg" -type f -delete 2>/dev/null || true
          echo "Cleanup complete"

      - name: Run downloader
        env:
          MODE: ${{ github.event.inputs.mode || 'fill-missing' }}
        run: python scripts/build_references.py --mode "$MODE"

      - name: Commit any new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A base-photos/ parallels/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update reference library [skip ci]"
            # Handle concurrent runs that may have landed first
            git pull --rebase origin main || git rebase --abort
            git push
          else
            echo "No changes to commit"
          fi
